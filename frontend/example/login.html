<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FC Career Hub | Manager Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface": "#ffffff",
              "secondary-container": "#532f9b",
              "error": "#ff7351",
              "on-tertiary-container": "#004d57",
              "primary-fixed": "#a2f31f",
              "surface-container-lowest": "#000000",
              "background": "#0e0e0e",
              "surface-container-high": "#20201f",
              "secondary-dim": "#ad8afb",
              "inverse-primary": "#436a00",
              "primary": "#bcff5f",
              "on-secondary-container": "#dac8ff",
              "on-tertiary-fixed-variant": "#005762",
              "inverse-on-surface": "#565555",
              "tertiary-container": "#00e3fd",
              "surface-variant": "#262626",
              "on-surface-variant": "#adaaaa",
              "tertiary-dim": "#00d4ec",
              "on-secondary-fixed-variant": "#5d3aa6",
              "error-container": "#b92902",
              "on-error-container": "#ffd2c8",
              "tertiary-fixed-dim": "#00d4ec",
              "outline": "#767575",
              "secondary-fixed-dim": "#cfb9ff",
              "on-primary": "#3d6100",
              "secondary-fixed": "#dbc9ff",
              "primary-container": "#a2f31f",
              "surface-container-low": "#131313",
              "on-secondary": "#2c006d",
              "on-background": "#ffffff",
              "on-error": "#450900",
              "primary-fixed-dim": "#95e400",
              "on-primary-fixed": "#294300",
              "error-dim": "#d53d18",
              "on-tertiary-fixed": "#003840",
              "surface-dim": "#0e0e0e",
              "surface-tint": "#bcff5f",
              "on-primary-container": "#365700",
              "on-tertiary": "#005762",
              "outline-variant": "#484847",
              "tertiary": "#81ecff",
              "surface-container": "#1a1a1a",
              "surface": "#0e0e0e",
              "tertiary-fixed": "#00e3fd",
              "surface-container-highest": "#262626",
              "surface-bright": "#2c2c2c",
              "on-primary-fixed-variant": "#3d6200",
              "on-secondary-fixed": "#401788",
              "primary-dim": "#95e400",
              "secondary": "#af8dfe",
              "inverse-surface": "#fcf9f8"
            },
            fontFamily: {
              "headline": ["Epilogue"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(38, 38, 38, 0.7);
            backdrop-filter: blur(20px);
        }
        .hero-gradient {
            background: linear-gradient(145deg, rgba(188, 255, 95, 0.05) 0%, rgba(14, 14, 14, 1) 100%);
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }
        .btn-shimmer:hover::after {
            left: 100%;
            top: 100%;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body overflow-hidden">
<!-- Auth Container -->
<main class="flex min-h-screen w-full">
<!-- Left Section: Visual Brand Identity -->
<section class="hidden lg:flex lg:w-3/5 xl:w-2/3 relative items-end p-12 overflow-hidden border-r border-outline-variant/10">
<!-- Background Image with data-alt for generation -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="cinematic low angle shot of an empty modern football stadium at night under dramatic floodlights with misty atmosphere and deep shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFX5iLpqbGqVPiO2ax9xkWZKSMrzXxEuEh8Gio7h8M9Dlh_yoD7XZzAIWKM9NlQj8cLVLbPSkc7wqYcYNUQe1oa99DETmiZ76FYYLCAjWDz03aj3Svgkb5cj_KO2YYZHpZMho24916xh4J3BNLKPlezDcDoHjdXa2P8nYihs17F5bMw5vGTfkF5ixAgVORBwN6QBMDQiYvmW2w0H2yIIFQ1vs7MVGqTcA23U9P0m9QcROFqpml09NRLm_xWctZfvJGNaQ5Q2QmZUY8"/>
<!-- Overlay Gradient for legibility and atmosphere -->
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/40 to-transparent"></div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent to-surface/80"></div>
</div>
<!-- Brand Typography Overlay -->
<div class="relative z-10 max-w-2xl">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">sports_soccer</span>
<h1 class="font-headline text-5xl font-black tracking-tighter italic">FC CAREER HUB</h1>
</div>
<p class="font-headline text-2xl text-on-surface-variant font-bold leading-tight mb-8">
                    MASTER THE TOUCHLINE.<br/>
<span class="text-on-surface">DRIVE YOUR LEGACY TO GLORY.</span>
</p>
<div class="flex gap-4">
<div class="h-1 w-12 bg-primary"></div>
<div class="h-1 w-12 bg-surface-container-highest"></div>
<div class="h-1 w-12 bg-surface-container-highest"></div>
</div>
</div>
<!-- Tactical Pattern Decal -->
<div class="absolute top-12 left-12 opacity-10">
<span class="material-symbols-outlined text-[200px]" style="font-variation-settings: 'wght' 100;">strategy</span>
</div>
</section>
<!-- Right Section: Interactive Auth Form -->
<section class="w-full lg:w-2/5 xl:w-1/3 bg-surface-dim flex flex-col justify-center items-center px-8 sm:px-12 md:px-20 relative">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="lg:hidden absolute top-12 left-1/2 -translate-x-1/2 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">sports_soccer</span>
<span class="font-headline text-2xl font-black tracking-tighter italic">FC CAREER HUB</span>
</div>
<div class="w-full max-w-md">
<!-- Header Stats/Context -->
<div class="mb-10 text-center lg:text-left">
<h2 class="font-headline text-3xl font-extrabold text-on-surface mb-2 tracking-tight">MANAGER LOGIN</h2>
<p class="text-on-surface-variant font-medium text-sm">Welcome back, Boss. The squad is waiting for today's briefing.</p>
</div>
<!-- Auth Form -->
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">Work Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors text-xl">alternate_email</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low border-0 focus:ring-2 focus:ring-primary text-on-surface rounded-none transition-all placeholder:text-outline/50" id="email" name="email" placeholder="name@club.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant" for="password">Security Key</label>
<a class="text-[10px] font-bold text-primary hover:text-primary-fixed uppercase tracking-wider transition-colors" href="#">Forgot Access?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors text-xl">lock</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low border-0 focus:ring-2 focus:ring-primary text-on-surface rounded-none transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-4 flex flex-col gap-6">
<button class="btn-shimmer w-full bg-gradient-to-br from-primary to-inverse-primary py-4 px-6 text-on-primary-fixed font-headline font-black text-sm uppercase tracking-widest hover:shadow-[0_0_20px_rgba(188,255,95,0.3)] active:scale-[0.98] transition-all" type="submit">
                            Enter Operations Center
                        </button>
<div class="relative flex items-center gap-4">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="text-[10px] font-bold text-outline uppercase tracking-widest">New Appointment</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<button class="w-full border border-outline-variant/50 py-4 px-6 text-on-surface font-headline font-bold text-sm uppercase tracking-widest hover:bg-surface-container-high transition-colors" type="button">
                            Apply for Manager Role
                        </button>
</div>
</form>
<!-- Footer Legal/Social -->
<div class="mt-12 flex justify-center gap-6 opacity-40">
<span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors">language</span>
<span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors">help_center</span>
<span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors">shield</span>
</div>
</div>
<!-- Subtle Texture Overlays -->
<div class="absolute bottom-0 right-0 p-8 pointer-events-none opacity-5">
<span class="material-symbols-outlined text-9xl">stadium</span>
</div>
</section>
</main>
<!-- UI Interaction Decorative Elements (No JS as requested) -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-secondary to-primary opacity-20 z-[100]"></div>
</body></html>
